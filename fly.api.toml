# The API (api.postula.intensoft.dev: REST, MCP, webhooks) and the worker on Fly.io, two process
# groups of one app. Deployed first by .github/workflows/deploy.yml; by hand:
# `fly deploy --config fly.api.toml`. Secrets (same set as the web): docs/deploy.md.
#
# Cost: the API stops when nobody calls it. The worker runs only while someone has "Búsqueda
# activa" on: the panel and the AI start it through the Machines API (FLY_API_TOKEN) and it exits
# by itself when everyone turns it off, so Fly leaves it stopped.
app = "postula-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Before the new version starts. If it fails, nothing is deployed and the old version keeps
  # running.
  release_command = "sh -c 'cd /app && pnpm db:migrate'"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  APP_URL = "https://app.postula.intensoft.dev"
  API_URL = "https://api.postula.intensoft.dev"
  CLIENT_IP_HEADER = "fly-client-ip"
  WORKER_FLY_APP = "postula-api"
  WORKER_PROCESS_GROUP = "worker"

[processes]
  app = "sh -c 'cd /app/apps/api && exec node_modules/.bin/tsx --tsconfig tsconfig.run.json src/server.ts'"
  worker = "sh -c 'cd /app/apps/api && exec node_modules/.bin/tsx --tsconfig tsconfig.run.json src/worker.ts'"

# The worker exits with 0 when everyone turned the search off: it must stay stopped then.
[[restart]]
  policy = "on-failure"
  retries = 5
  processes = ["worker"]

[http_service]
  internal_port = 3001
  force_https = true
  # Stops when idle and wakes on the next request: the jobs live in the worker, not here.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

# Milestone 3 fills forms with Chromium here: then it needs 1gb.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
